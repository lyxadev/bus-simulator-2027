name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.4
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
          mv Godot_v4.4-stable_linux.x86_64 godot

      - name: Download export templates
        run: |
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          unzip -q templates.tpz -d tmp
          mv tmp/templates/* ~/.local/share/godot/export_templates/4.4.stable/

      - name: Import project
        run: timeout 300 ./godot --headless --editor --quit || true

      - name: Export Web build
        run: |
          mkdir -p build/web
          ./godot --headless --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
