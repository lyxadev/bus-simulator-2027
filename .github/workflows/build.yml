name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      BLENDER_VERSION: "4.2.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          set -euo pipefail
          curl -fsSL -o blender.tar.xz "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p "$HOME/blender"
          tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" --version

      - name: Build bus model with Blender
        run: |
          set -euo pipefail
          "$HOME/blender/blender" -b --factory-startup --python tools/make_bus.py
          ls -lh assets/models/bus.glb

      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: timeout 300 ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --import || true

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: bus-model
          path: assets/models/bus.glb
